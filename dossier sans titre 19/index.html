<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DisJS - Login</title>
    <style>
        svg { width: 18px; height: 18px; vertical-align: middle; }
    </style>
    
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body {
            margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center;
            background: #1e1f22; color: #f2f3f5;
        }
        .card {
            background: #2b2d31; padding: 32px; border-radius: 10px; width: 100%; max-width: 360px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }
        h1 { margin: 0 0 6px; font-size: 22px; text-align: center; }
        p.sub { margin: 0 0 22px; color: #b5bac1; font-size: 14px; text-align: center; }
        input {
            width: 100%; padding: 11px; margin-bottom: 12px; border-radius: 6px;
            border: 1px solid #18191c; background: #1e1f22; color: #f2f3f5; font-size: 14px;
        }
        input:focus { outline: none; border-color: #5865f2; }
        button {
            width: 100%; padding: 11px; border: none; border-radius: 6px;
            background: #5865f2; color: white; font-size: 15px; font-weight: 600; cursor: pointer;
        }
        button:hover { background: #4752c4; }
        .toggle { margin-top: 14px; font-size: 13px; color: #b5bac1; text-align: center; }
        .toggle span { color: #00a8fc; cursor: pointer; }
        .toggle span:hover { text-decoration: underline; }
        #msg { color: #fa777c; font-size: 13px; text-align: center; margin-top: 10px; min-height: 18px; }
    </style>
</head>
<body>
    <div class="card">
        <h1 id="form_title">Welcome back!</h1>
        <p class="sub" id="form_sub">Log in to DisJS</p>
        <input type="text" id="user_name" placeholder="Username">
        <input type="password" id="user_pass" placeholder="Password">
        <button id="server_submit">Log In</button>
        <div id="msg"></div>
        <div class="toggle">
            <span id="toggle_mode">Need an account? Register</span>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
